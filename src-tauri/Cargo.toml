[package]
name = "redline"
version = "0.3.16"
description = "Redline — AEC PDF markup, takeoff, and document management"
authors = ["Emittiv L.L.C-FZ"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"
# The crate has multiple binaries (the app `redline` + the `bench` harness). Tauri's
# dev/build runs a bare `cargo run`, which is ambiguous with >1 bin — pin the default.
default-run = "redline"

[lib]
name = "redline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Headless §20 performance benchmark harness. Drives the render core directly
# (no Tauri/webview) over the bench corpus and measures open/tile/page-jump
# latency + peak RSS. Run: PDFIUM_DYNAMIC_LIB_PATH=... cargo run --release --bin bench -- <corpus-dir>
[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# MCP stdio server (MCP server design, 2026-09-01, docs/superpowers/specs/
# 2026-09-01-mcp-server-design.md §2). Pure protocol translator - no PDFium/Tauri
# dependency of its own - so it links fast and stays independently distributable from
# the GUI bundle (open question in the design doc §"Open questions for the owner" 2,
# not yet resolved by the owner: same installer vs separate package).
[[bin]]
name = "redline-mcp"
path = "src/bin/redline_mcp.rs"

# Dev tool: regenerates the scanned-CAD OCR fixture corpus (tools/fixtures/ocr/).
# Builds small synthetic text PDFs with lopdf, rasterizes each via the existing
# PDFium render path, then re-wraps the raster as a flattened image-only PDF (no
# text layer) - i.e. a synthetic "scan". Needs only default-feature deps
# (lopdf/pdfium-render/image), not the `ocr` feature itself - it never runs OCR,
# only produces the corpus OCR is benchmarked against. Requires
# PDFIUM_DYNAMIC_LIB_PATH. Run: `cargo run --bin gen-ocr-fixtures`.
[[bin]]
name = "gen-ocr-fixtures"
path = "src/bin/gen_ocr_fixtures.rs"

# Phase 2b bundling smoke test: loads a bundled Tesseract engine + tessdata
# and recognizes a tiny embedded fixture (tools/fixtures/ocr/selftest.png).
# Run against a CI-built release bundle (see .github/workflows/
# build-releases.yml's `build-ocr-check` steps) to prove the SHIPPED app can
# actually locate its bundled OCR resources, not just that the code compiles.
# `required-features` so a default (`ocr` off) build never tries to link it.
[[bin]]
name = "ocr-selftest"
path = "src/bin/ocr_selftest.rs"
required-features = ["ocr"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2.5.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.2.2"
tauri-plugin-log = "2.9.0"
# Auto-updater (checks update.json manifest on GitHub, downloads + verifies +
# installs the signed release). tauri-plugin-process supplies relaunch() so
# the frontend can restart into the new version after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Tier-2 real-app E2E harness (WebdriverIO + @wdio/tauri-service, embedded provider). Both
# gated cfg(debug_assertions) in lib.rs - never compiled into a release build, matching the
# other debug-only wiring in this crate. Pattern + versions copied verbatim from satchel-gui
# (forge.mms.name/emittiv/satchel PR #25) - see docs/TESTING.md.
tauri-plugin-wdio-webdriver = "1"
tauri-plugin-wdio = "1"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Logging ---
log = "0.4"

# --- Error handling ---
thiserror = "2"
anyhow = "1"

# --- Headless two-tier PDF diff (M6 compare module, shared with cad-export-api) ---
pdf-diff = { path = "../crates/pdf-diff" }

# --- PDF rendering (display only) ---
# pdfium-render 0.8.x per spec §3. Latest on crates.io is 0.9.1; pin to 0.8.x
# series as spec-locked. Use the "thread_safe" feature for use across tokio threads.
# PDFium binary: use pdfium-render's bundled auto-download via build.rs OR
# point PDFIUM_DYNAMIC_LIB_PATH env var at a prebuilt libpdfium.
pdfium-render = { version = "0.8.28", features = ["thread_safe", "image"] }

# --- Low-level PDF ops ---
# default-features minus "time": lopdf 0.44.0's "time" feature module fails to
# compile against the `time` crate version this workspace resolves
# (FormatItem::StringLiteral removed - upstream bug, fixed by unreleased
# J-F-Liu/lopdf#527 but not yet in a published crates.io version). We never use
# lopdf's time-crate date helpers (annotation.rs has its own chrono-based
# to_pdf_date/from_pdf_date), so dropping the feature avoids the broken module
# entirely with zero behavior change.
lopdf = { version = "0.44", default-features = false, features = ["chrono", "jiff", "rayon"] }

# --- Memory-mapped file loading ---
# Required for PDFs > 2 GiB: PDFium's streaming FPDF_LoadCustomDocument path uses
# a signed 32-bit internal file offset (2 GiB cap), so a 2.1 GB scanned set fails
# to load pages. mmap + FPDF_LoadMemDocument64 (64-bit clean) is the fix, without
# reading the whole file into RSS. See render::open_document.
memmap2 = "0.9.10"

# --- Image handling (tile encoding → PNG/RGBA bytes to webview; "jpeg" also used by
# docops::image_ops for Optimize's raster recompression pipeline) ---
image = { version = "0.25", features = ["png", "jpeg"] }

# --- Unique IDs ---
uuid = { version = "1.0", features = ["v4", "serde"] }

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- XLSX + CSV export (Markup List export, spec §7) ---
rust_xlsxwriter = "0.95.0"
csv = "1.4.0"

# --- Spatial index for snap targets (geometry module) ---
# rstar = r-tree for 2D snap-target lookups
rstar = "0.12"

# --- Full-text search (M4 S4) ---
tantivy = "0.22"
notify = "6"
roxmltree = "0.21.1"
flate2 = "1.1.9"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

# --- S2b client entitlement (emittiv-staff license consumer) ---
# Offline Ed25519 verification of the redline entitlement token.
ed25519-dalek = "2.2"
# base64url (de)coding of the token's <payload>.<signature> segments and the
# baked SPKI-DER public key PEM.
base64 = "0.22"
# HTTP calls to the emittiv-staff license issue/renew endpoints.
reqwest = { version = "0.12", features = ["json"] }
# Object-safe async trait for LicenseClient (dyn dispatch, so the Tauri
# commands can be tested against a fake without a live HTTP call).
async-trait = "0.1"

# --- OCR (Phase 2a, 2026-09-02; supersedes the Phase 1 `ocrs` engine choice -
# decision:h6k4psk6n7xegql9ya9g, observation:lr0cwsixkpbzei7vthon). A 2026-09-02
# bake-off (dev-reports/2026-09-02-redline-ocr-bakeoff.md) measured `ocrs` 0.13
# topping out at 30% overall recall against this crate's own scanned-CAD fixture
# corpus even with a rotate-4x fix pass (0% baseline vertical recall, its
# per-line RotatedRect detection notwithstanding - the recognition model itself
# is the bottleneck, not the geometry). Tesseract 5 via `leptess` cleared
# 93%/98% (baseline/rotate-4x) on the same corpus at a real but bounded
# native-dependency cost (pkg-config + system tesseract/leptonica; owner
# decision 2026-09-02 "switch to Tesseract"). Unlike ocrs, Tesseract has no
# per-line rotation detection (whole-page OSD only), so the `ocr` module
# implements its own rotate-4x-and-merge pass over whole-page rasters - see the
# module doc comment. `leptess` has no Cargo feature flags of its own; it links
# system tesseract/leptonica via `tesseract-plumbing`'s pkg-config-driven
# build.rs (verified against leptess v0.14.0's own Cargo.toml this session -
# only dependencies are `tesseract-plumbing ~0.8` + `thiserror 1`, no vendored
# build). Feature stays OFF by default: no `-ocr.pdf` writer, no UI, no
# auto-trigger yet - see the `ocr` module doc comment for phase scope.
leptess = { version = "0.14", optional = true }

[features]
default = []
ocr = ["dep:leptess"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
