name: Build macOS and Windows Releases

# This workflow runs on GitHub's free runners (macOS + Windows)
# Builds are uploaded to Forgejo releases automatically (env vars use GITEA_ prefix for API compatibility)
# Adapted from e-fees' build-releases.yml (see obs on redline PR that added it).

on:
  push:
    tags:
      - 'v*'
  # Auto-OCR (2026-09-03 Phase 2b bundling proof leg; gating fixed 2026-09-07
  # so tagged releases actually ship it - see below): every tag-triggered
  # release build now ALSO builds with `--features ocr` and runs the OCR
  # bring-up steps (Tesseract install, tessdata fetch, dylib bundling on
  # macOS / vcpkg static link on Windows, and the ocr-selftest bundling
  # smoke test) on BOTH desktop legs, before signing/upload. A failed smoke
  # test fails the job before any artefact is signed or uploaded (see
  # update-manifest's hard release gate below for why that also blocks the
  # manifest publish, not just the same-job signing steps).
  #
  # A separate manual workflow_dispatch run with build_ocr=true is the
  # no-release REHEARSAL of the exact same OCR build/bundle/smoke-test
  # steps, with signing/upload/manifest-publish skipped (no release cut).
  # See the "Determine OCR proof mode" step in build-macos/build-windows:
  # it sets two flags - `enabled` (build with --features ocr; true for BOTH
  # a tag push and the proof leg) and `proof_leg` (skip signing/upload/
  # manifest; true ONLY for the workflow_dispatch rehearsal). Prior to
  # 2026-09-07 these were a single flag, so a tag push never set it and
  # v0.3.17/v0.3.18 shipped without OCR despite the proof leg passing green
  # (obs: redline "OCR is not compiled into this build" owner report,
  # 2026-09-07) - fixed by this split, not by removing the rehearsal leg.
  #
  # Deliberately NOT a `push: branches: [feat/**]` trigger (that was tried
  # first, 2026-09-03, and removed on review feedback): it fired a full
  # macOS+Windows GitHub Actions build on every push to any feat/** branch,
  # workspace-wide, whether or not that push touched OCR at all - expensive
  # and surprising. workflow_dispatch is opt-in per run. See docs/ocr.md
  # "Triggering the OCR proof leg by hand" for the exact command.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.2.0)'
        required: true
        default: '0.2.0'
      build_ocr:
        description: 'OCR rehearsal: build with --features ocr, run the bundling smoke test, skip signing/upload (no release cut). Tag-triggered releases build OCR unconditionally regardless of this input.'
        type: boolean
        required: false
        default: false

env:
  GITEA_SERVER: https://forge.mms.name
  GITEA_OWNER: emittiv
  GITEA_REPO: redline

jobs:
  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only - Intel Mac support dropped per decision:boujy4d42i8w7zovifts (2026-06-29)
          - target: aarch64-apple-darwin
            pdfium_target: mac-arm64
    outputs:
      sig-aarch64: ${{ steps.get_sig.outputs.sig_aarch64 }}
      ocr-proof: ${{ steps.ocr_mode.outputs.proof_leg }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Auto-OCR: see the `on:` block comment above. Every step from here
      # down that publishes/signs/uploads a release artifact is gated
      # `if: steps.ocr_mode.outputs.proof_leg != 'true'` so a real tag
      # release still signs and ships (only the workflow_dispatch rehearsal
      # skips publish); every OCR bring-up step is gated on `enabled`
      # instead, which is true for both a tag push and the rehearsal.
      - name: Determine OCR proof mode
        id: ocr_mode
        shell: bash
        run: |
          # Two independent flags, deliberately split (2026-09-07, closes the
          # "tagged releases never build with --features ocr" gap - v0.3.17/
          # v0.3.18 shipped without OCR despite the proof leg passing green):
          #   - `proof_leg`: workflow_dispatch with build_ocr=true - the
          #     no-release rehearsal. Skips signing/upload/manifest (see the
          #     publish-step guards below and in update-manifest).
          #   - `enabled`: whether THIS build compiles with --features ocr
          #     and runs the OCR bring-up steps (Tesseract install, tessdata
          #     fetch, dylib bundling, smoke test). True for the proof leg
          #     AND for every real tag-triggered release - OCR now ships in
          #     every tagged build, not just the rehearsal.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_ocr }}" = "true" ]; then
            PROOF_LEG=true
          else
            PROOF_LEG=false
          fi
          if [ "$PROOF_LEG" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ENABLED=true
          else
            ENABLED=false
          fi
          echo "proof_leg=$PROOF_LEG" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$PROOF_LEG" = "true" ]; then
            # --bundles app (not the config's default app+dmg+nsis targets):
            # the proof leg only needs the .app to bundle dylibs into and run
            # the smoke test against - a DMG buys nothing here, and this leg
            # never signs/uploads/releases anything.
            echo "build_args=--features ocr --bundles app" >> "$GITHUB_OUTPUT"
          elif [ "$ENABLED" = "true" ]; then
            # Real tag release with OCR: use the config's default bundle
            # targets (DMG included - this IS the shipped artifact) plus the
            # ocr feature.
            echo "build_args=--features ocr" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm install

      - name: Fetch PDFium (${{ matrix.pdfium_target }})
        run: scripts/fetch-pdfium.sh ${{ matrix.pdfium_target }}

      - name: Install Tesseract (Homebrew, OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        run: brew install tesseract

      - name: Fetch OCR tessdata (OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        run: scripts/fetch-ocr-tessdata.sh

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compile-time license API URL default (mirrors build-windows below) - without
          # this, a macOS release build has NO baked default and license checks only work
          # via a runtime env override (src-tauri/src/license/client.rs).
          REDLINE_LICENSE_API_URL_DEFAULT: https://staff.emittiv.studio
        run: npm run tauri:build -- --target ${{ matrix.target }} ${{ steps.ocr_mode.outputs.build_args }}

      - name: Bundle Tesseract + Leptonica dylibs into the .app (OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        run: |
          # `leptess`/tesseract-plumbing links Tesseract + Leptonica as DYNAMIC
          # libraries via pkg-config at their absolute Homebrew paths - a
          # released .app can't rely on Homebrew being installed on the end
          # user's Mac. dylibbundler (https://github.com/SCG82/macdylibbundler,
          # verified 2026-09-03) is the standard tool for this: `-b` walks
          # `otool -L` recursively, copies every non-system dylib into `-d`,
          # and rewrites BOTH the executable's and each copied dylib's load
          # commands to `-p` (@executable_path/../Frameworks) - so this
          # doesn't touch tauri.conf.json's frameworks config at all.
          brew install dylibbundler

          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found under target/${{ matrix.target }}/release/bundle/macos"
            exit 1
          fi
          echo "App: $APP_PATH"

          # CRITICAL: Cargo's `ocr` feature is crate-wide, not per-binary - a
          # `--features ocr` build links Tesseract/Leptonica into EVERY
          # binary Tauri places in Contents/MacOS (bench, gen-ocr-fixtures,
          # ocr-selftest, redline, redline-mcp - Tauri bundles every [[bin]]
          # target declared in Cargo.toml, not just the app's main binary;
          # verified via `otool -L` on all 5 this session - all 5 link
          # libtesseract/libleptonica, not just the app itself). An EARLIER
          # version of this step ran dylibbundler against only the first
          # executable `find` returned (alphabetically "bench"), which fixed
          # bench's load commands but left the REAL app binary ("redline",
          # confirmed via `Contents/Info.plist`'s CFBundleExecutable key)
          # still pointing at absolute Homebrew paths - the actual shipped
          # app would have failed to launch OCR on a machine without
          # Homebrew, despite the smoke test passing (the smoke test ran via
          # `cargo run`, a fresh link against the CI runner's live Homebrew
          # install, so it never exercised the bundled/rewritten paths at
          # all). Fixed 2026-09-03 by looping dylibbundler over every
          # executable in Contents/MacOS instead of picking just one.
          mkdir -p "$APP_PATH/Contents/Frameworks"
          for EXE_PATH in "$APP_PATH/Contents/MacOS/"*; do
            if [ -f "$EXE_PATH" ] && [ -x "$EXE_PATH" ]; then
              echo "--- dylibbundler: $EXE_PATH ---"
              # -of (overwrite-files), NOT -od (overwrite-dir, which WIPES
              # the whole dest dir - would undo every prior iteration's
              # work). Verified locally: without -of, the 2nd+ iteration
              # errors "File .../libsharpyuv....dylib already exists" and
              # aborts, since dylibbundler's default is to refuse silently
              # overwriting an existing copy rather than skip/reuse it.
              dylibbundler -b -of \
                -x "$EXE_PATH" \
                -d "$APP_PATH/Contents/Frameworks/" \
                -p "@executable_path/../Frameworks/"
            fi
          done

          echo "Bundled dylibs:"
          ls -la "$APP_PATH/Contents/Frameworks/"
          MAIN_EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist")
          echo "Main app executable (CFBundleExecutable): $MAIN_EXE_NAME"
          echo "Its dependent libraries after bundling:"
          otool -L "$APP_PATH/Contents/MacOS/$MAIN_EXE_NAME"

      - name: OCR bundling smoke test (OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        run: |
          # Runs the ACTUAL bundled+dylib-rewritten copy of ocr-selftest
          # inside the .app (Contents/MacOS/ocr-selftest), NOT `cargo run`
          # (which would freshly link against the runner's live Homebrew
          # install and prove nothing about whether the bundling/rewriting
          # above actually works - see the dylibbundler step's comment for
          # why that was wrong in an earlier version of this leg). If the
          # install_name_tool rewrite is broken or a dylib is missing from
          # Contents/Frameworks, dyld resolution fails here even though
          # Homebrew's originals are still physically present on this
          # runner, because a rewritten @executable_path-relative load
          # command does not fall back to the pre-rewrite absolute path.
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          TESSDATA_DIR="$APP_PATH/Contents/Resources/resources/ocr/tessdata"
          if [ ! -f "$TESSDATA_DIR/eng.traineddata" ]; then
            echo "ERROR: bundled tessdata not found at $TESSDATA_DIR"
            find "$APP_PATH/Contents/Resources" -maxdepth 4
            exit 1
          fi
          "$APP_PATH/Contents/MacOS/ocr-selftest" --tessdata-dir "$TESSDATA_DIR"

      - name: Fix code signature
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        run: |
          # Find the .app bundle (workspace root target/, not src-tauri/target/)
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH to fix CSResourcesFileMapped issue..."
            codesign --force --deep --sign - --preserve-metadata=entitlements,requirements,flags,runtime "$APP_PATH"
            codesign --verify --verbose=4 "$APP_PATH"
          fi

      - name: Regenerate updater archive (post-bundle, post-sign)
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # BUG THIS CLOSES (found 2026-09-07 auditing v0.3.19's shipped assets):
          # `npm run tauri:build` above produces the updater archive
          # (*.app.tar.gz + .sig) from the .app as it existed IMMEDIATELY
          # after that build - before "Bundle Tesseract + Leptonica dylibs"
          # added Contents/Frameworks and before "Fix code signature" did the
          # final codesign. That stale archive therefore has ZERO
          # Contents/Frameworks entries and every binary inside it
          # (redline, redline-mcp, ocr-selftest, bench, gen-ocr-fixtures)
          # links Tesseract/Leptonica/libarchive by ABSOLUTE Homebrew path
          # (verified via `otool -L` on the extracted v0.3.19 archive) - a
          # Mac that auto-updates to that release without Homebrew installed
          # cannot launch the app. The DMG was already correct because
          # "Recreate DMG with fixed signature" rebuilds it from the final
          # .app; the updater archive never got the same treatment. Fix:
          # rebuild the archive from the FINAL bundled+signed .app instead,
          # mirroring Tauri's own layout (gzip tar whose root entry is
          # "<Name>.app/") and the Windows leg's "Regenerate updater
          # signature (post-Authenticode)" step above - sign the artifact
          # last, then regenerate the minisign signature over the exact
          # bytes that will actually ship.
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found to archive"
            exit 1
          fi
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          TARGZ_PATH="$APP_PATH.tar.gz"

          echo "Rebuilding $TARGZ_PATH from $APP_PATH (post-bundle, post-sign)"
          rm -f "$TARGZ_PATH" "$TARGZ_PATH.sig"
          # COPYFILE_DISABLE / COPY_EXTENDED_ATTRIBUTES_DISABLE: without these,
          # macOS bsdtar writes AppleDouble "._*" sibling entries into the
          # archive for any source file carrying extended attributes -
          # exactly what codesign/install_name_tool leave behind on files
          # they've just touched (the "Fix code signature" step above and
          # dylibbundler's rewrites). Those "._*" files sit inside Contents/
          # but were never part of the CodeResources seal, so a Gatekeeper
          # `codesign --verify --deep --strict` on the extracted .app fails
          # at launch - reproducing this PR's own target symptom (broken
          # post-update launch) through a different mechanism. Caught in
          # review of the first version of this fix (PR #109).
          export COPYFILE_DISABLE=1
          export COPY_EXTENDED_ATTRIBUTES_DISABLE=1
          tar -czf "$TARGZ_PATH" -C "$APP_DIR" "$APP_NAME"

          echo "Re-signing the updater archive with the Tauri updater key..."
          npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TARGZ_PATH"

          if [ ! -f "$TARGZ_PATH.sig" ]; then
            echo "ERROR: signer did not produce $TARGZ_PATH.sig"
            exit 1
          fi

      - name: Verify updater archive integrity (hard gate)
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        run: |
          # Structural gate so this class of defect cannot ship silently
          # again: fails the job (not a warning) if the regenerated updater
          # archive is missing the bundled OCR dylibs (when this is an OCR
          # build) or if its main executable still links anything under
          # /opt/homebrew. Mirrors the OCR smoke test's own hard-fail
          # posture earlier in this job.
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          TARGZ_PATH="$APP_PATH.tar.gz"
          MAIN_EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist")

          VERIFY_DIR=$(mktemp -d)
          tar -xzf "$TARGZ_PATH" -C "$VERIFY_DIR"
          EXTRACTED_APP=$(find "$VERIFY_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$EXTRACTED_APP" ]; then
            echo "ERROR: updater archive does not extract to a .app bundle"
            exit 1
          fi

          if [ "${{ steps.ocr_mode.outputs.enabled }}" = "true" ]; then
            if [ ! -d "$EXTRACTED_APP/Contents/Frameworks" ] || ! ls "$EXTRACTED_APP/Contents/Frameworks" | grep -qi libtesseract; then
              echo "ERROR: updater archive is an OCR build but Contents/Frameworks/libtesseract* is missing"
              find "$EXTRACTED_APP/Contents" -maxdepth 2
              exit 1
            fi
          fi

          BAD_LINKS=$(otool -L "$EXTRACTED_APP/Contents/MacOS/$MAIN_EXE_NAME" | grep -c '/opt/homebrew' || true)
          if [ "$BAD_LINKS" -gt 0 ]; then
            echo "ERROR: updater archive's main executable links $BAD_LINKS absolute Homebrew path(s):"
            otool -L "$EXTRACTED_APP/Contents/MacOS/$MAIN_EXE_NAME" | grep '/opt/homebrew'
            exit 1
          fi

          # Belt-and-braces: the re-tar step exports COPYFILE_DISABLE=1 to stop
          # bsdtar writing AppleDouble "._*" sibling files into the archive in
          # the first place (they'd sit outside the CodeResources seal and
          # fail Gatekeeper at launch - see that step's comment). Check here
          # too, so a runner/tar behavior change that reintroduces them fails
          # the build instead of shipping a broken signature silently.
          if find "$EXTRACTED_APP" -name '._*' | grep -q .; then
            echo "ERROR: updater archive contains AppleDouble ._* files - these break the code signature seal:"
            find "$EXTRACTED_APP" -name '._*'
            exit 1
          fi

          # The actual Gatekeeper-equivalent check: does the extracted .app's
          # signature still verify? This is the property the ._* check above
          # is only a proxy for, and the property "Fix code signature" was
          # supposed to guarantee before this archive-regeneration step
          # existed - confirm the re-tar didn't undo it.
          if ! codesign --verify --verbose=4 --deep --strict "$EXTRACTED_APP"; then
            echo "ERROR: codesign --verify failed on the updater archive's extracted .app - the re-tar corrupted the signature."
            exit 1
          fi

          echo "OK: updater archive has no absolute Homebrew links, no AppleDouble files, and passes codesign --verify --deep --strict."
          rm -rf "$VERIFY_DIR"

      - name: Recreate DMG with fixed signature
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        run: |
          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)

          if [ -n "$DMG_PATH" ] && [ -n "$APP_PATH" ]; then
            echo "Recreating DMG with re-signed app..."
            DMG_DIR=$(dirname "$DMG_PATH")
            DMG_NAME=$(basename "$DMG_PATH")
            rm "$DMG_PATH"
            hdiutil create -volname "Redline" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
            echo "Created new DMG: $DMG_PATH"
          fi

      - name: Create archive name
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        id: archive
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            echo "NAME=Redline_${{ steps.version.outputs.VERSION }}_aarch64" >> $GITHUB_OUTPUT
            echo "ARCH=aarch64" >> $GITHUB_OUTPUT
          else
            echo "NAME=Redline_${{ steps.version.outputs.VERSION }}_x64" >> $GITHUB_OUTPUT
            echo "ARCH=x64" >> $GITHUB_OUTPUT
          fi

      - name: Find artifacts
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        id: find_artifacts
        run: |
          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          TARGZ_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" | head -1)
          SIG_PATH=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz.sig" | head -1)
          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "TARGZ_PATH=$TARGZ_PATH" >> $GITHUB_OUTPUT
          echo "SIG_PATH=$SIG_PATH" >> $GITHUB_OUTPUT

      - name: Get signature
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        id: get_sig
        run: |
          if [ -f "${{ steps.find_artifacts.outputs.SIG_PATH }}" ]; then
            SIG=$(cat "${{ steps.find_artifacts.outputs.SIG_PATH }}")
            if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
              echo "sig_aarch64=$SIG" >> $GITHUB_OUTPUT
            else
              echo "sig_x86_64=$SIG" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create checksum
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        run: |
          cd $(dirname "${{ steps.find_artifacts.outputs.DMG_PATH }}")
          shasum -a 256 $(basename "${{ steps.find_artifacts.outputs.DMG_PATH }}") > ${{ steps.archive.outputs.NAME }}.dmg.sha256

      - name: Upload to Gitea Release
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=5
          RELEASE_ID=""

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Getting or creating release..."

            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/tags/v${{ steps.version.outputs.VERSION }}")

            if echo "$RELEASE_JSON" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
              echo "Using existing release: $RELEASE_ID"
              break
            fi

            echo "Release not found, creating..."
            RELEASE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases" \
              -d "{\"tag_name\": \"v${{ steps.version.outputs.VERSION }}\", \"name\": \"Redline v${{ steps.version.outputs.VERSION }}\", \"body\": \"Release v${{ steps.version.outputs.VERSION }}\"}")

            if echo "$RELEASE_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              echo "Created new release: $RELEASE_ID"
              break
            fi

            echo "Failed to get/create release, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to get or create release after $MAX_RETRIES attempts"
            exit 1
          fi

          echo "Uploading DMG..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.find_artifacts.outputs.DMG_PATH }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.dmg"

          if [ -f "${{ steps.find_artifacts.outputs.TARGZ_PATH }}" ]; then
            echo "Uploading tar.gz for updater..."
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -F "attachment=@${{ steps.find_artifacts.outputs.TARGZ_PATH }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.app.tar.gz"
          fi

          echo "Uploading checksum..."
          cd $(dirname "${{ steps.find_artifacts.outputs.DMG_PATH }}")
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.archive.outputs.NAME }}.dmg.sha256" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=${{ steps.archive.outputs.NAME }}.dmg.sha256"

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        if: always() && steps.ocr_mode.outputs.proof_leg != 'true'
        with:
          name: macos-${{ steps.archive.outputs.ARCH }}
          path: |
            ${{ steps.find_artifacts.outputs.DMG_PATH }}
            ${{ steps.find_artifacts.outputs.TARGZ_PATH }}
            ${{ steps.find_artifacts.outputs.SIG_PATH }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      sig-windows: ${{ steps.get_sig.outputs.sig_windows }}
      ocr-proof: ${{ steps.ocr_mode.outputs.proof_leg }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Auto-OCR Phase 2b: mirrors build-macos's "Determine OCR proof mode" -
      # see the `on:` block comment at the top of this file.
      - name: Determine OCR proof mode
        id: ocr_mode
        shell: bash
        run: |
          # Mirrors build-macos's split (see its "Determine OCR proof mode"
          # comment for the full rationale): `proof_leg` gates skip-publish
          # only; `enabled` gates the OCR feature build/bring-up steps and is
          # true for the proof leg AND every real tag-triggered release.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_ocr }}" = "true" ]; then
            PROOF_LEG=true
          else
            PROOF_LEG=false
          fi
          if [ "$PROOF_LEG" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ENABLED=true
          else
            ENABLED=false
          fi
          echo "proof_leg=$PROOF_LEG" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" = "true" ]; then
            echo "build_args=--features ocr" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Fetch PDFium (win-x64)
        shell: bash
        run: scripts/fetch-pdfium.sh win-x64

      # Windows-latest ships vcpkg preinstalled at C:\vcpkg with
      # VCPKG_INSTALLATION_ROOT already set (verified 2026-09-03,
      # actions/runner-images Windows2022-Readme.md) - alias it to VCPKG_ROOT,
      # which is what the `vcpkg` Rust crate actually reads (verified via its
      # docs.rs page: VCPKG_ROOT first, then user-wide `vcpkg integrate
      # install`, then a cargo-vcpkg tree). tesseract-sys's build.rs (verified
      # against its own source, ccouzens/tesseract-sys) calls
      # `vcpkg::Config::new().find_package("tesseract")` on Windows - no
      # manual TESSERACT_INCLUDE_PATHS/TESSERACT_LINK_PATHS/TESSERACT_LINK_LIBS
      # env vars needed as long as vcpkg finds the port.
      #
      # STATIC linking (`x64-windows-static-md`, the vcpkg crate's own DEFAULT
      # triplet for 64-bit Windows when VCPKGRS_DYNAMIC is unset) is chosen
      # deliberately over the dynamic `x64-windows` triplet leptess's own
      # README example uses: Tesseract's real dependency tree (leptonica plus
      # its own image-format libs) is large enough that dynamic linking would
      # mean bundling and NSIS-packaging a matching set of DLLs (the same
      # problem dylibbundler solves on macOS, with no equivalent tool in this
      # pipeline) - static linking bakes everything into redline.exe instead,
      # needing zero extra DLL-bundling work. This is unverified against a
      # real vcpkg build of the tesseract PORT until this workflow actually
      # runs - some vcpkg ports don't support every triplet cleanly - which is
      # exactly what this OCR-proof leg exists to prove or disprove.
      - name: Install Tesseract (vcpkg, OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install tesseract:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg install tesseract failed"; exit 1 }

      - name: Fetch OCR tessdata (OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        shell: bash
        run: scripts/fetch-ocr-tessdata.sh

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compile-time default for the S2b license-gate base URL (src-tauri/src/license/
          # client.rs's resolve_base_url) - lets a released Windows binary activate the
          # entitlement gate with no user-set REDLINE_LICENSE_API_URL env var. The runtime
          # env var still overrides this at call time if ever set.
          REDLINE_LICENSE_API_URL_DEFAULT: https://staff.emittiv.studio
        run: npm run tauri:build -- ${{ steps.ocr_mode.outputs.build_args }}

      - name: OCR bundling smoke test (OCR build)
        if: steps.ocr_mode.outputs.enabled == 'true'
        shell: bash
        run: |
          # Unlike macOS (where tauri build's .app bundle IS the final
          # artifact and already contains Contents/Resources), Windows'
          # bundled resource layout only materializes after the NSIS
          # installer actually runs - installing it silently on a CI runner
          # is its own source of flakiness (UAC/elevation prompts against
          # `installMode: perMachine`). To keep this leg's failure signal
          # narrowly about "does the vcpkg-linked Tesseract binary actually
          # recognize text on Windows" - the genuinely unproven, risky part -
          # this instead exercises the RAW build output plus a manually
          # placed resources/ dir, mirroring the "next to the executable"
          # portable-layout candidate `lib.rs::resolve_tessdata_dir` already
          # checks (its 3rd candidate). Proving the NSIS-installed layout
          # end-to-end is flagged as a residual gap for a follow-up, not
          # silently assumed to work.
          mkdir -p target/release/resources/ocr/tessdata
          cp src-tauri/resources/ocr/tessdata/eng.traineddata target/release/resources/ocr/tessdata/
          cargo run --release --features ocr --bin ocr-selftest -- \
            --tessdata-dir target/release/resources/ocr/tessdata

      # --- Windows Authenticode signing (self-signed cert, obs:z6byyxo59r0ilt2bq397) ---
      # `tauri:build` above already produced the NSIS installer AND its Tauri-updater
      # minisign signature (target/release/bundle/nsis/*-setup.exe.sig) in one shot.
      # Authenticode-signing the .exe in place after that point would change its bytes
      # and invalidate that minisign signature (the auto-updater hashes the exact
      # released file). So: sign first, then REGENERATE the minisign signature over the
      # now-signed exe (`tauri signer sign`) so the two never go out of sync. Both new
      # steps no-op cleanly (exit 0, no error) when the signing secrets are absent, so
      # forks/PRs without the cert still produce an unsigned-but-working build.
      - name: Check Windows signing secrets
        id: sign_check
        shell: bash
        env:
          WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_SIGN_CERT_B64" ] && [ -n "$WINDOWS_SIGN_CERT_PASSWORD" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "WINDOWS_SIGN_CERT_B64/WINDOWS_SIGN_CERT_PASSWORD not set - skipping Authenticode signing, build stays unsigned."
          fi

      # NOTE (2026-08-05, fix/windows-signtool-native): osslsigncode was dropped here.
      # v0.3.7's release run failed at this step - "Failed to parse PKCS#12 file ...
      # (Wrong password?)" followed by OpenSSL provider errors ("could not load legacy.dll",
      # "Algorithm (RC2-40-CBC : 0)" unsupported). The password was never wrong: our PFX is a
      # legacy-format PKCS#12 (RC2-40-CBC), and OpenSSL 3 (which osslsigncode links) removed
      # legacy-cipher support into an opt-in provider it can't load on this runner. The exact
      # same cert+secret signed every release through v0.3.6, so this was runner-image/OpenSSL
      # drift, not a credential change - confirmed, no cert re-issue needed.
      #
      # Fixed by signing with signtool.exe directly instead: it's part of the Windows SDK,
      # preinstalled on windows-latest (github/runner-images), and loads PFX files via
      # Windows CryptoAPI/CNG - which still supports legacy PKCS#12 ciphers like RC2-40-CBC
      # natively. `signtool sign /f <pfx> /p <password> ...` signs straight from the PFX file,
      # no store import or thumbprint lookup needed (Microsoft docs, "Using SignTool to Sign a
      # File"). This also drops the `choco install osslsigncode` step entirely - nothing left
      # to install.
      - name: Sign Windows installer (Authenticode)
        if: steps.sign_check.outputs.available == 'true' && steps.ocr_mode.outputs.proof_leg != 'true'
        id: sign
        # shell: pwsh - NOT bash. Git-Bash/MSYS rewrites any argument starting with
        # "/" into a Windows path, so signtool's /fd /tr /td flags never reached it
        # ("SignTool Error: No file digest algorithm specified" despite /fd SHA256
        # being passed - v0.3.8 run 30994084371). PowerShell has no such mangling.
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_B64: ${{ secrets.WINDOWS_SIGN_CERT_B64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            Write-Host "No NSIS installer found - nothing to sign."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Error "signtool.exe not found under Windows Kits on this runner."; exit 1 }
          Write-Host "Using signtool: $($signtool.FullName)"

          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_B64))

          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_SIGN_CERT_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $nsis.FullName
          $rc = $LASTEXITCODE
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          if ($rc -ne 0) { Write-Error "signtool failed with exit code $rc"; exit $rc }

          # NOT `signtool verify /pa`: that enforces the Authenticode trust policy and
          # ALWAYS fails for our SELF-SIGNED cert ("certificate chain processed, but
          # terminated in a root certificate which is not trusted") - it failed the
          # v0.3.9 build even though signing itself succeeded. Assert a signature is
          # PRESENT instead, which is the property we actually care about here.
          $sig = Get-AuthenticodeSignature $nsis.FullName
          if (-not $sig.SignerCertificate) { Write-Error "No Authenticode signature present after signing."; exit 1 }
          Write-Host "Authenticode signature present (status: $($sig.Status), subject: $($sig.SignerCertificate.Subject))"
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Signed $($nsis.FullName)"

      - name: Regenerate updater signature (post-Authenticode)
        if: steps.sign_check.outputs.available == 'true' && steps.sign.outputs.signed == 'true' && steps.ocr_mode.outputs.proof_leg != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          NSIS_PATH=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          # Overwrites the stale <NSIS_PATH>.sig (computed pre-Authenticode-signing
          # by `tauri:build` above) with one that matches the now-signed bytes.
          npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$NSIS_PATH"

      - name: Find installers
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        id: find_installers
        shell: bash
        run: |
          NSIS_PATH=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          NSIS_SIG=$(find target/release/bundle/nsis -name "*-setup.exe.sig" | head -1)
          echo "NSIS_PATH=$NSIS_PATH" >> $GITHUB_OUTPUT
          echo "NSIS_SIG=$NSIS_SIG" >> $GITHUB_OUTPUT

      - name: Get signature
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        id: get_sig
        shell: bash
        run: |
          if [ -f "${{ steps.find_installers.outputs.NSIS_SIG }}" ]; then
            SIG=$(cat "${{ steps.find_installers.outputs.NSIS_SIG }}")
            echo "sig_windows=$SIG" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Gitea Release
        if: steps.ocr_mode.outputs.proof_leg != 'true'
        shell: bash
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=5
          RELEASE_ID=""

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Getting or creating release..."

            RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/tags/v${{ steps.version.outputs.VERSION }}")

            if echo "$RELEASE_JSON" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
              echo "Using existing release: $RELEASE_ID"
              break
            fi

            echo "Release not found, creating..."
            RELEASE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases" \
              -d "{\"tag_name\": \"v${{ steps.version.outputs.VERSION }}\", \"name\": \"Redline v${{ steps.version.outputs.VERSION }}\", \"body\": \"Release v${{ steps.version.outputs.VERSION }}\"}")

            if echo "$RELEASE_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              echo "Created new release: $RELEASE_ID"
              break
            fi

            echo "Failed to get/create release, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to get or create release after $MAX_RETRIES attempts"
            exit 1
          fi

          echo "Uploading NSIS installer..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${{ steps.find_installers.outputs.NSIS_PATH }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/releases/$RELEASE_ID/assets?name=Redline_${{ steps.version.outputs.VERSION }}_x64-setup.exe"

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        if: always() && steps.ocr_mode.outputs.proof_leg != 'true'
        with:
          name: windows
          path: |
            ${{ steps.find_installers.outputs.NSIS_PATH }}
            ${{ steps.find_installers.outputs.NSIS_SIG }}

  update-manifest:
    name: Update manifest
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Auto-OCR Phase 2b: never runs for the OCR-proof leg (no tag, no release,
    # no manifest to publish) - `needs.build-macos.outputs.ocr-proof` is this
    # job's only signal for that, since it has no event context of its own
    # beyond what its `needs:` jobs computed.
    #
    # HARD RELEASE GATE (2026-09-07): requires both platform jobs to have
    # actually SUCCEEDED - not merely "not cancelled". Now that tag releases
    # build with --features ocr and run the OCR bundling smoke test inside
    # build-macos/build-windows, a smoke-test failure fails that job's
    # `result`. The previous `always() && result != 'cancelled'` condition
    # would still have run this job on a `result: failure` (job outputs
    # survive a later step's failure, since they're set by an early step),
    # publishing an update.json with an empty/missing signature for a
    # version whose real installer was never signed or uploaded - exactly
    # the "smoke test failure could still ship a broken auto-update" gap a
    # hard release gate must close, not just gate signing/upload within the
    # same job.
    if: needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.outputs.ocr-proof != 'true'
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate and display update.json
        id: generate
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIG_AARCH64="${{ needs.build-macos.outputs.sig-aarch64 }}"
          SIG_WIN="${{ needs.build-windows.outputs.sig-windows }}"

          cat > update.json << EOF
          {
            "version": "$VERSION",
            "notes": "Release v$VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG_AARCH64",
                "url": "https://forge.mms.name/emittiv/redline/releases/download/v$VERSION/Redline_${VERSION}_aarch64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$SIG_WIN",
                "url": "https://forge.mms.name/emittiv/redline/releases/download/v$VERSION/Redline_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "Generated update.json:"
          cat update.json

          CONTENT=$(base64 -w 0 update.json)
          echo "content=$CONTENT" >> $GITHUB_OUTPUT

      - name: Upload update.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json

      - name: Push to Gitea via API
        continue-on-error: true
        run: |
          echo "Attempting to push update.json to Gitea..."

          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/contents/update.json?ref=main")

          SHA=$(echo "$RESPONSE" | jq -r '.sha // empty')

          if [ -n "$SHA" ]; then
            echo "Updating existing file (SHA: $SHA)"
            PAYLOAD=$(jq -n \
              --arg content "${{ steps.generate.outputs.content }}" \
              --arg message "chore: Update manifest for v${{ steps.version.outputs.VERSION }}" \
              --arg sha "$SHA" \
              '{content: $content, message: $message, sha: $sha}')
          else
            echo "Creating new file"
            PAYLOAD=$(jq -n \
              --arg content "${{ steps.generate.outputs.content }}" \
              --arg message "chore: Update manifest for v${{ steps.version.outputs.VERSION }}" \
              '{content: $content, message: $message}')
          fi

          RESULT=$(curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ env.GITEA_SERVER }}/api/v1/repos/${{ env.GITEA_OWNER }}/${{ env.GITEA_REPO }}/contents/update.json" \
            -d "$PAYLOAD")

          echo "API Response: $RESULT"

          if echo "$RESULT" | jq -e '.content.sha' > /dev/null 2>&1; then
            echo "Successfully pushed update.json to Gitea"
          else
            echo "Failed to push to Gitea (may need manual update)"
            echo "The update.json artifact is available for manual upload"
          fi

      # The updater endpoint reads update.json from THIS repo's main branch on
      # raw.githubusercontent.com - commit it back here so released clients see
      # new versions (e-fees relies on a manual sync for this step and its GitHub
      # manifest goes stale; this closes that gap for redline).
      - name: Commit update.json to GitHub main
        continue-on-error: true
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" manifest-repo
          cp update.json manifest-repo/update.json
          cd manifest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore: update manifest for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main
